# Render Blueprint: a Docker web service + a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: ai-news-digest-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-digest-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
databases:
  - name: news-digest-db
    plan: free
